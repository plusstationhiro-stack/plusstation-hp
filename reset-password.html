<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>++Station 新しいパスワード</title>
    <link rel="stylesheet" href="/styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.min.js"></script>
    <script src="/config.js"></script>
  </head>
  <body>
    <main class="page">
      <div id="panel-loading" class="muted">読み込み中…</div>

      <div id="panel-missing" class="card hidden">
        <h1 class="title">設定エラー</h1>
        <p class="sub">個人用 Supabase の環境変数が未設定です。Vercel の Environment Variables を確認してください。</p>
      </div>

      <div id="panel-invalid" class="card hidden">
        <h1 class="title">リンクが無効です</h1>
        <p class="sub">
          アプリの「パスワードをお忘れの方」から送られたメールのリンクを開き直すか、もう一度メールを送ってください。
        </p>
      </div>

      <div id="panel-done" class="card center hidden">
        <h1 class="title">完了しました</h1>
        <p class="sub">新しいパスワードで、++Station アプリのログイン画面からサインインしてください。</p>
        <button type="button" class="btn" id="btn-open-app">アプリを開く</button>
        <p class="muted" style="margin-top: 16px">アプリが開かない場合は、ホーム画面から ++Station を起動してください。</p>
      </div>

      <div id="panel-form" class="card hidden">
        <h1 class="title">++Station</h1>
        <p class="sub">個人アプリ用の新しいパスワードを設定してください。</p>
        <p id="form-error" class="error hidden"></p>
        <form id="form">
          <label class="label" for="password">新しいパスワード（6文字以上）</label>
          <input id="password" class="input" type="password" autocomplete="new-password" required />
          <label class="label" for="confirm">新しいパスワード（確認）</label>
          <input id="confirm" class="input" type="password" autocomplete="new-password" required />
          <button class="btn" type="submit" id="btn-save">パスワードを保存</button>
        </form>
      </div>
    </main>
    <script src="/reset-password.js"></script>
  </body>
</html>
